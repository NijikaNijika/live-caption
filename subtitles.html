<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时同传字幕</title>
<style>
  :root{
    --bg:#0b0e14; --done:#e8eef7; --live:#8b98ad; --zh:#5ad1ff; --dim:#3a4356; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--done);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;}
  #wrap{height:100%;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;gap:14px;padding:10px 20px;
    border-bottom:1px solid #1b2130;font-size:13px;color:var(--dim);}
  header b{color:var(--done);font-weight:600}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
  #dot.ok{background:#3ddc97}
  #dot.stale{background:#e5534b}
  #stat{margin-left:auto;display:flex;gap:18px}
  #lines{flex:1;overflow-y:auto;padding:22px 26px 60px;scroll-behavior:smooth}
  .seg{margin:0 0 20px;padding-left:14px;border-left:3px solid transparent}
  .seg.done{border-left-color:#1f2a3d}
  .seg.live{border-left-color:var(--zh)}
  .en{font-size:19px;line-height:1.45;color:var(--live)}
  .seg.done .en{color:var(--done)}
  .zh{font-size:27px;line-height:1.4;color:var(--zh);margin-top:5px;font-weight:500}
  .seg.live .zh{color:#f0c674}
  .meta{font-size:11px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
  .cursor{display:inline-block;width:9px;height:19px;background:var(--zh);
    vertical-align:-3px;animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;
    font-size:12px;color:var(--dim)}
  .err{color:#e5534b}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span id="dot"></span>
    <b>实时同传</b>
    <span id="status">等待数据…</span>
    <span id="stat">
      <span>段数 <b id="n">0</b></span>
      <span>最近上屏 <b id="lat">–</b></span>
      <span>总计 <b id="tot">–</b></span>
      <span>翻译耗时 <b id="tms">–</b></span>
    </span>
  </header>
  <div id="lines"></div>
</div>
<div id="hint">本页每 300ms 读取一次 live.json · 语言：英文 → 中文</div>

<script>
const LIVE = 'live.json';
const linesEl = document.getElementById('lines');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
const nEl = document.getElementById('n');
const latEl = document.getElementById('lat');
const tmsEl = document.getElementById('tms');
const totEl = document.getElementById('tot');

let rendered = new Map();   // seq -> DOM 节点
let lastUpdate = 0;
let sticky = true;
const SNAPSHOT = window.__SNAPSHOT__ || null;   // 由 serve.mjs?snapshot=1 内联注入

// 用户往上滚时不要强行拉回底部
linesEl.addEventListener('scroll', () => {
  const nearBottom = linesEl.scrollHeight - linesEl.scrollTop - linesEl.clientHeight < 120;
  sticky = nearBottom;
});

function fmtMs(ms){ return ms == null ? '–' : (ms/1000).toFixed(2)+'s'; }

function makeSeg(seq, isLive){
  const wrap = document.createElement('div');
  wrap.className = 'seg ' + (isLive ? 'live' : 'done');
  wrap.innerHTML = '<div class="en"></div><div class="zh"></div><div class="meta"></div>';
  return wrap;
}

function paint(){
  linesEl.appendChild(document.createElement('span'));
}

async function tick(){
  try{
    let d;
    if(SNAPSHOT){
      d = SNAPSHOT;                 // 快照模式：数据已内联，不 fetch
    } else {
      const res = await fetch(LIVE + '?t=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      d = await res.json();
    }
    lastUpdate = d.updated || 0;
    dot.className = 'ok';
    statusEl.textContent = SNAPSHOT ? '快照' : '接收中';
    statusEl.className = '';

    const segs = [];
    for(const l of (d.lines || [])) segs.push({...l, isLive:false});
    if(d.live && d.live.en) segs.push({...d.live, isLive:true});

    for(const s of segs){
      let node = rendered.get(s.seq);
      if(!node){
        node = makeSeg(s.seq, s.isLive);
        node.dataset.seq = s.seq;
        rendered.set(s.seq, node);
        linesEl.appendChild(node);
      }
      node.className = 'seg ' + (s.isLive ? 'live' : 'done');
      node.querySelector('.en').textContent = s.en || '';
      const zhEl = node.querySelector('.zh');
      if(s.isLive){
        zhEl.innerHTML = '';
        zhEl.appendChild(document.createTextNode('识别中'));
        const c = document.createElement('span'); c.className='cursor';
        zhEl.appendChild(c);
      } else {
        zhEl.textContent = s.zh || '';
      }
      const parts = [];
      if(!s.isLive && s.tFinalize && s.tDone){
        // 两个口径都显示，避免误读：
        //   上屏 = 说完 → 译文出现（你实际感受到的延迟）
        //   总计 = 从开口算起（含攒音频，主要由句子本身长度决定）
        parts.push('上屏 ' + fmtMs(s.tDone - s.tFinalize));
        parts.push('总计 ' + fmtMs(s.tDone - s.tStart));
      }
      if(s.ms) parts.push('翻译 ' + fmtMs(s.ms));
      node.querySelector('.meta').textContent = parts.join(' · ');
    }

    // 清理已被更早段落替换掉的 live 节点
    const liveSeqs = new Set(segs.filter(s=>s.isLive).map(s=>s.seq));
    for(const [seq,node] of rendered){
      if(node.classList.contains('live') && !liveSeqs.has(seq)){
        node.classList.remove('live'); node.classList.add('done');
      }
    }

    const done = (d.lines||[]);
    nEl.textContent = done.length ? done[done.length-1].seq : 0;
    const last = done[done.length-1];
    if(last){
      latEl.textContent = fmtMs((last.tDone||0)-(last.tFinalize||last.tStart||0));
      totEl.textContent = fmtMs((last.tDone||0)-(last.tStart||0));
      tmsEl.textContent = fmtMs(last.ms);
    }

    if(sticky) linesEl.scrollTop = linesEl.scrollHeight;
  }catch(e){
    if(SNAPSHOT) return;            // 快照失败就别一直刷状态
    const age = Date.now() - lastUpdate;
    if(lastUpdate && age > 3000){ dot.className='stale'; statusEl.textContent='数据中断（captioner 已停止？）'; }
    else { dot.className=''; statusEl.textContent='等待 captioner 启动…'; }
  }
}

if(SNAPSHOT){
  tick();                            // 只渲染一次，不轮询
} else {
  setInterval(tick, 300);
  tick();
}
</script>
</body>
</html>
